name: Build RPCS3 Memory Breakpoints MSBuild

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_REPOSITORY_NAME: RPCS3/rpcs3
  BUILD_SOURCEBRANCHNAME: memory-breakpoints
  BUILD_PR_NUMBER: ''
  BUILD_SOURCEVERSION: 79822e1ac5ece67ffc6b68ea8aa3f4ae6ad2d948
  BUILD_ARTIFACTSTAGINGDIRECTORY: ${{ github.workspace }}/artifacts/
  COMPILER: msvc
  QT_VER_MAIN: '6'
  QT_VER: '6.11.1'
  QT_VER_MSVC: 'msvc2022'
  QT_DATE: '202605090529'
  LLVM_VER: '19.1.7'
  VULKAN_VER: '1.4.341.1'
  VULKAN_SDK_SHA: 'bcf2d75aa9556889ab974858666e20b3655b6055a0db704ccb47279ff33b5bfe'
  CCACHE_SHA: '859141059ac950e1e8cd042c66f842f26b9e3a62a1669a69fe6ba180cb58bbdf'
  CCACHE_BIN_DIR: 'C:\ccache_bin'
  CCACHE_DIR: 'C:\ccache'
  CCACHE_INODECACHE: 'true'
  CCACHE_SLOPPINESS: 'time_macros'
  DEPS_CACHE_DIR: './dependency_cache'
  QTDIR: 'C:\Qt\6.11.1\msvc2022_64'
  VULKAN_SDK: 'C:\VulkanSDK\1.4.341.1'

jobs:
  build:
    name: RPCS3 79822e1a Memory Breakpoints MSBuild
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout RPCS3 79822e1a
        uses: actions/checkout@v4
        with:
          repository: RPCS3/rpcs3
          ref: 79822e1ac5ece67ffc6b68ea8aa3f4ae6ad2d948
          fetch-depth: 1

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          nuget restore rpcs3.sln
          if ($LASTEXITCODE -ne 0) {
            throw "NuGet restore failed."
          }

      - name: Download official RPCS3 Windows dependencies
        shell: bash
        run: |
          .ci/setup-windows.sh
          .ci/setup-windows-ci-vars.sh win64 msvc

      - name: Export official RPCS3 CI variables
        shell: bash
        run: |
          while IFS='=' read -r key val; do
            [ -z "$key" ] && continue
            case "$key" in \#*) continue ;; esac
            echo "$key=$val" >> "$GITHUB_ENV"
          done < .ci/ci-vars.env

      - name: Enable memory breakpoints in the MSBuild projects
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $file = '.\buildfiles\msvc\common_default.props'
          $text = Get-Content -Path $file -Raw

          $needle = '_HAS_EXCEPTIONS=0;%(PreprocessorDefinitions)'
          $replacement = '_HAS_EXCEPTIONS=0;RPCS3_HAS_MEMORY_BREAKPOINTS;%(PreprocessorDefinitions)'

          if (-not $text.Contains($needle)) {
            throw "Could not find the common MSBuild preprocessor-definition line."
          }

          $updated = $text.Replace($needle, $replacement)
          Set-Content -Path $file -Value $updated -NoNewline -Encoding utf8

          $found = Select-String `
            -Path $file `
            -Pattern 'RPCS3_HAS_MEMORY_BREAKPOINTS'

          if (-not $found) {
            throw "RPCS3_HAS_MEMORY_BREAKPOINTS was not inserted."
          }

          Write-Host "Memory-breakpoint macro inserted into:"
          Write-Host $file

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Compile RPCS3 using the official Windows build route
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          msbuild rpcs3.sln `
            /m:2 `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PreferredToolArchitecture=x64 `
            /p:CLToolPath="$env:CCACHE_BIN_DIR" `
            /p:UseMultiToolTask=true `
            /p:CustomAfterMicrosoftCommonTargets="$env:GITHUB_WORKSPACE\buildfiles\msvc\ci_only.targets" `
            /v:minimal

          if ($LASTEXITCODE -ne 0) {
            throw "Official RPCS3 MSBuild compilation failed."
          }

      - name: Verify the finished build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not (Test-Path '.\bin\rpcs3.exe')) {
            throw "bin\rpcs3.exe was not created."
          }

          @'
          RPCS3 commit: 79822e1ac5ece67ffc6b68ea8aa3f4ae6ad2d948
          Windows build route: official rpcs3.sln + MSBuild
          RPCS3_HAS_MEMORY_BREAKPOINTS=enabled globally
          Purpose: Trusty Bell enemy-size investigation
          '@ | Set-Content `
            -Path '.\bin\MEMORY_BREAKPOINT_BUILD.txt' `
            -Encoding UTF8

          Get-Item '.\bin\rpcs3.exe'
          Get-Item '.\bin\MEMORY_BREAKPOINT_BUILD.txt'

      - name: Package the finished RPCS3 build
        shell: bash
        run: |
          mkdir -p "$BUILD_ARTIFACTSTAGINGDIRECTORY"
          .ci/deploy-windows.sh

      - name: Upload finished RPCS3
        uses: actions/upload-artifact@v4
        with:
          name: RPCS3-MemoryBreakpoints-79822e1a-MSBuild
          path: artifacts/**
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
